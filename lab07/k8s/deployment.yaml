apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # at most one extra pod during an update
      maxUnavailable: 0  # never go below the desired count
  template:
    metadata:
      labels:
        app: hello
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: hello
          image: ACR_LOGIN_SERVER/hello:v1 # replaced by the README command
          ports:
            - containerPort: 8000
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: hello-config
                  key: GREETING
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          # Not ready = no traffic from the Service
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          # Not alive = kubelet restarts the container
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
